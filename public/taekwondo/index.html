<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Taekwondo — Dima</title>
  <meta name="description" content="Dima's taekwondo belt testing: forms and board breaking.">
  <meta property="og:title" content="Dima's Taekwondo">
  <meta property="og:description" content="Belt testing: forms and board breaking.">
  <meta property="og:image" content="https://dima.vaschuk.com/taekwondo/poster.jpg">
  <meta name="theme-color" content="#10241a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥋</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #10241a;
      --panel: #2a1d12;
      --panel-edge: #5b3d22;
      --gold: #f6c544;
      --leaf: #7bd35a;
      --text: #f3ecd8;
      --muted: #b9c9a8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(ellipse at top, #1f4a2e 0%, var(--bg) 70%);
      color: var(--text);
      font-family: "VT323", ui-monospace, monospace;
      font-size: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 16px 24px;
      gap: 14px;
    }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .tabs a {
      font-family: "Press Start 2P", monospace;
      font-size: 10px;
      text-decoration: none;
      color: var(--muted);
      background: var(--panel);
      border: 3px solid var(--panel-edge);
      border-radius: 6px;
      padding: 8px 12px;
    }
    .tabs a[aria-current="page"] { color: var(--gold); background: var(--panel-edge); }
    .tabs a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    h1 {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(14px, 3vw, 22px);
      margin: 6px 0 0;
      color: var(--leaf);
      text-shadow: 3px 3px 0 #000;
      text-align: center;
    }
    .frame {
      width: min(100%, 440px, calc((100dvh - 190px) * 720 / 1282));
      min-width: min(100%, 260px);
      border: 6px solid var(--panel-edge);
      outline: 4px solid var(--panel);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.55);
      background: #000;
    }
    video { display: block; width: 100%; aspect-ratio: 720 / 1282; background: #000; }
    p { margin: 0; color: var(--muted); text-align: center; }
    footer { font-size: 16px; color: #6f8a66; }
  </style>
</head>
<body>
  <nav class="tabs" aria-label="Site">
    <a href="/">🦫 Game</a>
    <a href="/taekwondo/" aria-current="page">🥋 Taekwondo</a>
  </nav>
  <h1>Dima's Taekwondo</h1>
  <div class="frame">
    <video controls playsinline preload="metadata" poster="poster.jpg">
      <source src="taekwondo.mp4" type="video/mp4">
      Your browser can't play this video. <a href="taekwondo.mp4">Download it</a>.
    </video>
  </div>
  <p>Belt testing: forms and board breaking</p>
  <footer>dima.vaschuk.com</footer>
</body>
</html>
